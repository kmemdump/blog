    <noscript><pre class="entry-raw">While thinking about the title of this article, my perspective on this topic,
increasingly zoomed out as I am wont to do. Going from the &quot;downfall of 
software&quot;, to &quot;downfall of engineering&quot;, &quot;downfall of capitalism&quot; to the 
&quot;downfall of civilisation&quot;. I suppose this is because problems in scaling 
systems are fractal and ultimately boils down to the main bottleneck, the human
element.

Anywhoo... 
Why is it that as hardware gets better and software gets worse as time passes.
A couple reasons:
1. Parkinson's Law
1. Corporate switching from engineering CEOs to sales CEOs 
1. Proprietary hardware design (Lack of ISA standardization)

Future considerations:
1. Death of Moore's Law

References:
1. https://www.youtube.com/watch?v=kZRE7HIO3vk
</pre></noscript>
