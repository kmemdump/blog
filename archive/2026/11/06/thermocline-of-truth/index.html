    <noscript><pre class="entry-raw">A thermocline is the plateau in the change of temperature that occurs in
larger bodies of water, such as lakes and oceans. 

The thermocline of truth describes the tendency for the middle layers of a
hierarchy to present an obfuscation of the truth to the highest layers of 
leadership. This in my experience occurs as a result of incompetence and 
self preservation. Occasionally also a foundation for abuse and exploitative 
behaviour. 

The takeaway here is that the highest layers of leadership needs to maintain a 
direct communication channel with those on the lowest layers of the hierarchy
in order to prevent this issue. 

References:
1. https://brucefwebster.com/2008/04/15/the-wetware-crisis-the-themocline-of-truth/
