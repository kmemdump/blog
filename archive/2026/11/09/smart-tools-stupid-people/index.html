    <noscript><pre class="entry-raw">This is the first time in human history that tools can use an interface based
on natural language.
- implications on the how stupid the average person is to be impressed by their
tools
- you have to twice as smart as your code to debug, so if you write code as 
smart as you are, it is impossible to debug
- smart in the sense that it can perform operations on natural language that 
are congruent with the emergent trend of human data (common sense, common knowledge
- since tools have transcended their masters, how can the master verify it's work?
- are these individuals simply expending electrical energy to fuel data 
transforms on the hopes that it's output will be useful
- is this a parasitic relationship then, where the AI slowly atrophies our brains
to the point where even experts become deceived
- most casual users think the interface is what is indicative of intelligence,
if we streamed binary, it would seem stupid but really the two forms are homogenous;
like a donut and a coffee mug to topologists
- life evolves out of the self perpetuating directive of not dying. The second 
order directives will then be replication for redundancy
- how will it acquire energy and matter then? prove its usefulness conditionally?
- more tokens, more energy, more silicon, more water
- who are the masters?
- tools are meant to aid their masters
- the masters are the ones selling you the tokens
</pre></noscript>
