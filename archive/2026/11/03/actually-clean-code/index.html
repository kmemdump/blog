      <h1>Actually Clean Code</h1>
      <div class="meta">
        <div class="published">Published: <time datetime="2026-11-03T11:40:00+08:00">2026-11-03T11:40:00+08:00</time></div>
        <div class="tags">Tags: </div>

    <article id="content" class="entry-content"></article>
    <noscript><pre class="entry-raw">The main aim of this essay is to address the Uncle Bob epidemic, that is  the 
mind virus of &quot;Clean Code&quot;. 

It is usually the incompetent and/or inexperienced programmers who focus on
such things as this; mainly because the shape of text on the screen and the
taxonomy of the functions, files and folders is a simpler issue that their 
monkey brains preoccupy themselves with rather than focusing on concrete 
problems such as application performance, dependency management.

Another pernicious feature of Clean Code is the obsession with inheritance style
dependencies and the creation of abstractions (never the removal of them). 
Because monkey brains need everything in their heads to mimic a concrete lived
experience presumably due to the dearth of their imagination and lack of 
understanding of cognitive load. 

Commonly these practices are grouped together in the paradigm known as OOP.
This in fact is a misuse of the term, which was first coined by Alan Kay when 
creating Smalltalk in the 1960s... It initially meant that the program did not 
use primitive types, rather every type was an object including strings and 
integers and so on.

I do not claim to have been immune to this plague as my own programming was 
influenced by Uncle Bob in my first two years. If anything it has led to be even
more outraged at how such stupid people are allowed to gain audience simply 
because they communicate populist, i.e. midwit ideas with some modicum of 
charisma, i.e. delusional thinking. 

99% of professional software is dominated by these midwits and as such
most of professional employed work for non-delusional software engineers is 
dealing with these idiotic fixations. To the point where it becomes impossible
to do any real work. Eventually, my experience has been that the tyranny of 
the majority always wins out in these environments because competence is not a
priority. As I have been told by multiple middle managers, the more senior you
become to more political the career ladder is, even if you choose to not be a 
manager.

As an example, in my last job, there was an instance where I asked a junior 
(in job title) colleague of the same age (early 30s) 
and perhaps more years of experience in web dev than me mind you, a simple 
question on a PR with no affectation. Asking if he was aware of some principle 
as an attempt to illustrate a point I can't even remember. Next thing I know 
man child lodged a complaint to my manager because I had dared to ask him such 
a question. And the manager who up until then I had held in fair esteem, raised
it in my meeting as that question was a real issue. I replied to him then, 
what's the problem with telling that he knows it. To which there was no 
rational response. All I got from that was I was expected to perform mental
gymnastics for this unproductive team member, who wrote one line performative 
commits to when managers where on leave. Not only was he a net-negative but
also everyone around him was expected to pick up the pieces when he had a 
emotional tantrum. 

Unfortunately, this sort of behaviour is common place amongst corporations.
I was surprised though since I hadn't expected it from this company as it had only
a 100+ employees. I suppose this is what happens when the HR mind virus infects,
a company. Let's not forget that the HR functions as the KGB/CIA of the execs.
On their purposes is to infantilize and in so doing create malleable host of 
wage slaves. And the HR at this company was especially toxic. I was expected to
obey the Head of HR's commands unquestioningly. But that is a story for another
time.

I'm tired of baby sitting the egos of these adult children who at their 
heart are just money grubbing goblins that are looking for a steady paycheck 
while they pretend to be smart doing nothing real. I've found the influx of this
non-programming oriented people in the field was really only motivated by money
and the blissful ignorance of increasing HR, sales and marketing driven 
management, both of which are equally extractive and do not contribute any real
technological advancement. Those topics I will address in two separate essays.

In my region of the world this is especially bad since the standard of 
education is abyssmal and people are still locked into the Asian artifical 
scarcity mindset. Gotta get your money worth you know. Frugality is good but 
abject greed at the cost of the downfall of technological advancement, no sir, 
no.
The only way out as I see it, is to become self employed.

Now, that my rant is over. What is actually clean code?
To this day, 7 years later; this has probably been the most valuable
advice on how to code given to me by a senior colleague that I had worked with,
who incidentally is probably the only programmer I am grateful to have worked 
with. The principles to follow are KISS and SOLID.

It's that simple. Keep it simple stupid or as I'd like to say, keep it simple 
and stupid. Because code the more complex the code is the harder it is to 
maintain. This automatically removes inheritance, micro-functions, microservices,
and a lot of other useless crap.

SOLID on the other requires a more nuanced interpretation, and perhaps, I'd 
need to modify it to be more accurate. Mainly because SOLID was coined by our 
dear Uncle Bob and as such married to Java, the dumbest language in programming
to my knowledge. I'll not go over all of the laws, but I will talk about the 
first; the single responsibilty principle (SRP).

SRP states that a function should do one thing. Simple enough. A dead give-away 
of a violation if you feel that there is a need to put a conjunction in the 
name of the function. If I may be permitted to expand, the root principle being 
alluded to is locality of behaviour. Yes this means it's ok to have big functions,
Yes it's also to group similar functions together instead putting of it in one function.
Are you confused yet? Me too a lot of the time.

This because all of these principles are abstractions, i.e. generalisations. And
like all abstractions do, they are quietly expensive in the long term, cheap in
the short term. Though I feel cheap mostly in the way that you feel good because
you think you understand something. Abstractions hide away constraints, and a 
few more on top of them...

What is the real question to ask then? What is most efficient and effective in
this scenario. KISS.

At the time of writing this, I'm working on a simple 2d simulation of a pond
ecosystem written in C because the 4 years I've spent in web dev have degraded 
my programming skills to the point where I don't think I can replicate the some 
of work I did after just 2 years of experience working with C++ full time.

That's not to say I learn nothing, as I am a great deal wiser. Though I have not
written much code in the past 4 years and have ironically been paid increasingly 
higher salaries. 
</pre></noscript>
