      <h1>No Procedures Communicate</h1>

    <article id="content" class="entry-content"></article>
    <noscript><pre class="entry-raw">I find that in working with other procedure are largely inferior to 
communication. It has been my experience in software that communication is 
superior to procedure. 

That should be simple enough to understand, however people by and large seem
to be predisposed to adding unnecessary process overhead as a rule. Rather than
solve the problem, they dance around because creating cruft is easier than 
communicating effectively.

In the case of the programmer, I find that shared code is the main vein of 
communication. If learning to communicate effectively was not hard enough
already now we have a relatively new skill to master.

And creating procedure around the process is always easier. 

So rather creating different version of diagrams and design documents;
In the words, one of the better managers I've worked with;
&quot;Show me the code&quot;

I dont know how many times I've had the thought, in the time that I've spent 
writing these design documents we could have simply implemented it and tested 
it. And eventually I did just did that and continue to do so.
</pre></noscript>
