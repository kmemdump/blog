      <h1>Corporations Are Software Junkyards</h1>
      <div class="meta">
        <div class="published">Published: <time datetime="2026-11-08T13:01:26+08:00">2026-11-08T13:01:26+08:00</time></div>
        <div class="tags">Tags: <span class="tag">corporate</span></div>
      </div>
    </header>
    <article id="content" class="entry-content"></article>
    <noscript><pre class="entry-raw">Let's start this by talking about the biggest corporate engineering meme prior to AI
, i.e. microservices. 
Need I say it?... This was a monumentally bad idea.

My opinion is this design evolved out of:
1. The lack of training &amp; upskilling in the modern workplace
1. The subsequent need to isolate mistakes 
1. Astronaut architecture

My first introduction to microservices in &quot;professional&quot; software was at Grab.
Grab is the dominant ride hailing app, it's the Uber of South East Asia. I'm 
sure that there are excellent engineering teams at Grab, but unfortunately due
to my lack of experience in web dev and my lack of practice in algorithms I 
did not make cut for these teams and was shunted to what I can only describe as
a managerial cesspit. I'm not a CS grad that had the luxury of their student 
years to grind leetcode for years. I had trained on the job and algorithms
are a stupid test for programmer competency anyway.

The reason why I say this is because my direct manager and the skip level
manager where not proficient technically. The skip level manager was an MBA 
grad and the direct manager had only 3 years of professional coding experience
and was 6 years into his career. 

As such they were unable to provide technical guidance and most of their work 
was occupied with back and forth negotiations in meetings trying to communicate
ideas and create structures around an implementation they do not understand. As
such most of their work results in misinformation.

This need not be a negative if the managers got their hands dirty with the code
base or allowed the engineer to iterate on their own designs at a smaller scale.
However due to the need for visibility and headlines to progress their main 
goal, career advancement, they also architect...

This combination of hierarchically superiority, technical inferiority and flashy
KPIs is a ripe environment for the creation of astronaut architecture. What is 
that you might ask? In simple terms, it's people creating diagrams instead of 
writing code.

So it was announced after our &quot;senior leadership&quot; spent some time huddled in
gatekept meetings while the real engineers fought with previous iterations of 
slop architecture, that we had our new North Star!

A new diagram to solve the previous architecture! It was at this moment I 
realized that these poeple had no idea what they were doing. I had spent the next
2 years of career there constantly fighting against this &quot;bad engineering&quot; while
I was constantly framed as being combative. This is because as I was told 
again and again working about making good impressions, not one manager I had
talked to cared about the underlying quality of work.

A memorable moment that always brings a dark smile to my lips was when my skip 
level manager, audibly lost his shit when I had presented an analysis of the 
design of certain microservice and data dependency hell that resulted. His exact
words were &quot;what's wrong with! it's input output&quot;. This was a man in his mid 40s,
who had previous worked as a manager at Cisco, was a CTO in India and had an MBA.
MBA engineering at its finest... Grim...

I was even shamed publicly by a higher level manager in front of other colleagues
because of the political machinations engineered by the career manager, I 
reported to. This direct manager even pressured me to say nothing to our 
COO when she came to visit our office. Years later after I had rescued 3 separate
projects, this same manager refused to assign any new work to me, effectively 
freezing my career. When I mentioned this in our 1 on 1s, he said to me that &quot;I 
was unable to do anything&quot;. Suffice to say he was sociopathic corporate rat, who
used his shallow engineering knowledge to impress his non-technical counterparts.
In his presentation on himself, his main engineering contribution was a helper
function in the house Go testing library. All this function did was swap function
pointers in a test's execution context.

If you're still here you may be wondering, what does all of this have to do 
with engineering?! Nothing, and that my friends is why corporations are 
software junkyards. It's where engineering dies.
</pre></noscript>
