    <article id="content" class="entry-content"></article>
    <noscript><pre class="entry-raw">The office of corporate internal affairs (CIA), also known as the HR department.
Typically composed of two-faced Karens in unhappy marriages. Need I say more.

Control is the currency of the game. HR is not there to help you. HR is meant
to guard the interests of the company against internal threats. Kind of the 
opposite of PR. I only now noticed the &quot;coincidental&quot; rhyme of the
abbreviations.

The Head of HR at Lazada, whom I was acquainted with once said to me that there
was nothing &quot;human&quot; about human resources. It's all just numbers.
</pre></noscript>
