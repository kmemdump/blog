    <noscript><pre class="entry-raw">In my limited professional experience, it's my belief that the official creation
of feature maintenance focused roles, such as a &quot;software mechanic&quot;.

Not all software devs I have, I daresay a majority are not qualified to create
distributable/ shared code, in light their designs are a net-negative.
This currently is a grey area in grading software engineers, when rather this 
may actually create an opportunity for more of these test and maintenance gifted
engineers.

The work of design across industries has always been glorified and therefore
those who otherwise may not be otherwise suited will aspire to it. Glorified
for good reason though since it is a rare thing, good design. Ironically made
even more so by the influx of mechanics.
</pre></noscript>
