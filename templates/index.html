<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="page">
    <h1>Index</h1>
    <ul class="entry-list">{% for entry in entries %}
      <li><a href="{{entry.url}}">{{entry.title}}</a> <span class="date">{{entry.date}}</span></li>{% end %}
    </ul>
  </main>
</body>
</html>
