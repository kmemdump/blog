<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="page">
    <h1>Index</h1>
    <ul class="entry-list">{% for entry in entries %}
      <li><a href="{{entry.url}}">{{entry.title}}</a> <span class="date">{{entry.date}}</span></li>{% end %}
    </ul>
    <footer class="site-footer">
      <p>&copy; Copyright 2026 by Krishen Mohan. Content licensed under the <a href="https://creativecommons.org/licenses/by-nc/4.0/">Creative Commons Attribution-NonCommercial 4.0 International License</a>.</p>
    </footer>
  </main>
</body>
</html>
