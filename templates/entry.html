<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="page entry-page">
    <a class="back" href="/">&larr; index</a>
    <header class="entry-header">
      <h1>{{title}}</h1>
      <div class="meta">
        <div class="created">Created: <time datetime="{{created}}">{{created}}</time></div>
        <div class="published">Published: <time datetime="{{published}}">{{published}}</time></div>
        <div class="tags">Tags: {% for tag in tags %}<span class="tag">{{tag}}</span>{% end %}</div>
      </div>
    </header>
    <article class="entry-content markdown-body">{{content}}</article>
    <footer class="site-footer">
      <p>&copy; Copyright 2026 by Krishen Mohan. Content licensed under the <a href="https://creativecommons.org/licenses/by-nc/4.0/">Creative Commons Attribution-NonCommercial 4.0 International License</a>.</p>
    </footer>
  </main>
</body>
</html>
